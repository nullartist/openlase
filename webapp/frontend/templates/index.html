<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLase Web - Laser Control Interface</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴 OpenLase Web</h1>
            <p class="subtitle">Laser Control Interface</p>
        </header>

        <main>
            <div class="panel preview-panel">
                <h2>Preview</h2>
                <div class="preview-container">
                    <canvas id="preview-canvas" width="500" height="500"></canvas>
                </div>
                <div class="preview-info">
                    <span id="point-count">Points: 0</span>
                    <span id="fps-display">FPS: 0</span>
                </div>
            </div>

            <div class="panel controls-panel">
                <h2>Controls</h2>
                
                <div class="control-section">
                    <h3>Status</h3>
                    <div class="status-grid">
                        <div class="status-item">
                            <span class="label">DAC:</span>
                            <span id="dac-status" class="status-value">--</span>
                        </div>
                        <div class="status-item">
                            <span class="label">Output:</span>
                            <span id="output-status" class="status-value">--</span>
                        </div>
                        <div class="status-item">
                            <span class="label">Mode:</span>
                            <span id="mode-status" class="status-value">--</span>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Output Control</h3>
                    <div class="button-group">
                        <button id="btn-start" class="btn btn-primary">▶ Start</button>
                        <button id="btn-stop" class="btn btn-danger">■ Stop</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Pattern</h3>
                    <select id="pattern-select" class="control-select">
                        <option value="">Loading...</option>
                    </select>
                    <div id="pattern-params" class="params-container"></div>
                    <button id="btn-apply-pattern" class="btn btn-secondary">Apply Pattern</button>
                </div>

                <div class="control-section">
                    <h3>Settings</h3>
                    <div class="setting-item">
                        <label for="pps-slider">Points Per Second:</label>
                        <input type="range" id="pps-slider" min="5000" max="65000" value="30000">
                        <span id="pps-value">30000</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>OpenLase Web &copy; 2024 | Based on <a href="https://github.com/marcan/openlase">OpenLase</a></p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
